<!doctype html>
<html lang="en" class="is-loading">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Configure a sculptural Stap lamp in 3D." />
    <title>Stap — Light with character</title>
    <link rel="stylesheet" href="/src/loading-screen.css" />
  </head>
  <body>
    <div id="loading-screen" role="status" aria-live="polite" aria-atomic="true">
      <div class="loading-disc" aria-hidden="true"></div>

    <div id="app" inert aria-busy="true"></div>
    <script type="module" src="/src/bootstrap.js"></script>
  </body>
</html>
